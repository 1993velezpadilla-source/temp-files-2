plugins {
    id "com.android.application"
}

android {
    namespace "com.gtx.wifiexamlab"
    compileSdk 35

    defaultConfig {
        applicationId "com.gtx.wifiexamlab"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
