name: WiFi Lab Build

on:
  push:
    branches:
      - wifi-security-lab-v1
    paths:
      - "wifi_lab.py"
      - "wifi_lab_bundle.py"
      - "wifi_lab_batch.py"
      - "RUN_WIFI_LAB.bat"
      - "README_WIFI_LAB.md"
      - "docs/WIFI_LAB_FUNCTIONS.md"
      - ".github/workflows/wifi-lab-build.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: |
          python -m py_compile wifi_lab.py
          python -m py_compile wifi_lab_bundle.py
          python -m py_compile wifi_lab_batch.py
      - name: CLI help smoke tests
        run: |
          python wifi_lab.py --help
          python wifi_lab_bundle.py --help
          python wifi_lab_batch.py --help
      - name: Offline self-test
        run: python wifi_lab.py selftest

  windows-exe:
    runs-on: windows-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager
        run: python -m pip install --upgrade pyinstaller
      - name: Build one-file executable
        run: pyinstaller --onefile --name WiFiSecurityLab wifi_lab.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: WiFiSecurityLab-windows
          path: dist/WiFiSecurityLab.exe
          if-no-files-found: error
