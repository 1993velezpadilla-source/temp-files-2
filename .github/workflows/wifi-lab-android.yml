name: WiFi Lab Android APK

on:
  push:
    branches:
      - wifi-security-lab-v1
    paths:
      - "android-wifi-lab/**"
      - ".github/workflows/wifi-lab-android.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-wifi-lab
        run: gradle --no-daemon :app:assembleDebug

      - name: SHA-256
        run: sha256sum android-wifi-lab/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Exam-Lab-Android-debug
          path: android-wifi-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
