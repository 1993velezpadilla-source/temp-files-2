name: Build Isla del Ritmo APK
on:
  push:
    branches: [main]
    paths:
      - 'demos/isla-del-ritmo/android/**'
      - 'demos/isla-del-ritmo/v0.3/**'
      - '.github/workflows/isla-del-ritmo-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK from GitHub runner
        run: echo "ANDROID_HOME=$ANDROID_HOME; sdkmanager=$(command -v sdkmanager)"
      - name: Install Android build SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle game HTML and inline PNG art
        run: |
          mkdir -p demos/isla-del-ritmo/android/app/src/main/assets
          cp demos/isla-del-ritmo/v0.3/ISLA_DEL_RITMO_JUGAR.html demos/isla-del-ritmo/android/app/src/main/assets/index.html
          test -s demos/isla-del-ritmo/android/app/src/main/assets/index.html
      - name: Compile installable Android APK
        working-directory: demos/isla-del-ritmo/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare download
        run: |
          mkdir -p demos/isla-del-ritmo/download
          cp demos/isla-del-ritmo/android/app/build/outputs/apk/debug/app-debug.apk demos/isla-del-ritmo/download/IslaDelRitmo-Demo-0.3.apk
          test -s demos/isla-del-ritmo/download/IslaDelRitmo-Demo-0.3.apk
      - name: Attach installable APK to workflow
        uses: actions/upload-artifact@v4
        with:
          name: IslaDelRitmo-Android-Demo-0.3
          path: demos/isla-del-ritmo/download/IslaDelRitmo-Demo-0.3.apk
      - name: Publish direct GitHub APK download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/isla-del-ritmo/download/IslaDelRitmo-Demo-0.3.apk
          if ! git diff --cached --quiet; then
            git commit -m "Release installable Isla del Ritmo Android demo 0.3"
            git push origin HEAD:main
          fi
      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk="demos/isla-del-ritmo/download/IslaDelRitmo-Demo-0.3.apk"
          tag="isla-del-ritmo-v0.3"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "Isla del Ritmo — Android Demo 0.3" --notes "APK Android instalable. Juego offline, PNG integrados y soporte para importar una canción APEX."
          fi
