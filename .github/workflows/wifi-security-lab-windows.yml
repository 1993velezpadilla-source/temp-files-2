name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [wifi-security-lab-v1]
    paths:
      - "wifi-security-lab/**"
      - ".github/workflows/wifi-security-lab-windows.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name WiFiSecurityLab wifi-security-lab/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: WiFiSecurityLab-Windows
          path: dist/WiFiSecurityLab.exe
